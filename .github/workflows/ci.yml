name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files
  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check all shell scripts
        run: |
          shopt -s globstar
          for f in **/*.sh; do
            bash -n "$f"
          done
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run test suites
        # Suites need only bash/jq/grep/awk (preinstalled on ubuntu-latest);
        # the workflow-guard suite mocks gh via a stub on PATH.
        run: ./test/run-tests.sh
  stow-dry-run:
    name: Stow dry run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify stow is available
        run: command -v stow || brew install stow
      - name: Dry-run stow
        env:
          WORKSPACE: ${{ github.workspace }}
          STOW_TARGET: ${{ runner.temp }}/fakehome
        run: |
          mkdir -p "$STOW_TARGET/.claude/skills" "$STOW_TARGET/.config"
          stow -nv -d "$WORKSPACE" -t "$STOW_TARGET" -R dotfiles
  install-dry-run:
    name: Install dry run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: dotdev
      - name: Dry-run install
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          cp -R "$GITHUB_WORKSPACE/dotdev" "$HOME/dotdev"
          cd "$HOME/dotdev"
          DRY_RUN=1 bash install.sh
  finalize-stamp:
    # D-006 Phase 5a — server-side finalize-stamp gate. Closes the auto-merge
    # bypass observed on PR #167: server-side merges never consult the local
    # merge-gate hook, so a PR could land without a fresh finalize stamp.
    # NON-BLOCKING during the soak week: the check step carries
    # continue-on-error, so failures are loud in the step summary but do not
    # brick PRs. Planned flip (recorded follow-up, same pattern as
    # routing-eval.yml): drop continue-on-error and mark the job required in
    # branch protection after the soak week.
    # FLIP PRECONDITIONS (must be addressed in the flip PR, not after):
    #   1. Env breakage reads green: kernel exit 10 warn-permits with a
    #      ::warning — once required, a broken runner (or a PR setting
    #      LEDGER_PYTHON) shows a passing check. The flip must either assert
    #      python3+PyYAML in a prior step (making exit 10 an infra alarm) and
    #      refuse the warn-permit when LEDGER_PYTHON is set, or accept
    #      annotated-green explicitly.
    #   2. Self-graded gate: checker, kernel, AND this workflow file all come
    #      from the PR head, so a PR can grade itself. All three need pinning
    #      outside PR control before the check is load-bearing, and they need
    #      DIFFERENT mechanisms: FINALIZE_CHECK_LEDGER_SH pins only the kernel
    #      (it sets LEDGER_SH); the checker itself must be run from a base-ref
    #      copy (e.g. `git show origin/main:scripts/finalize-stamp-check.sh`),
    #      and the workflow needs a reusable-workflow call from a base-pinned
    #      caller or CODEOWNERS on .github/workflows/**.
    name: Finalize stamp
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # This job checks out and executes PR-authored code; pin the token to
    # read-only so a hostile PR cannot leverage the job's credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # PR head, not the merge ref: stamp freshness is defined against the
          # PR head; full history is needed for ancestry + diff-tree freshness.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check finalize stamp (soak week — non-blocking)
        continue-on-error: true
        env:
          # Passed via env, not inline interpolation: head refs are
          # attacker-controlled text and must never be spliced into the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: ./scripts/finalize-stamp-check.sh --base "$BASE_SHA" --head-ref "$HEAD_REF"
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
