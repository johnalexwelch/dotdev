repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ^openwiki/
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-w, -i=4, -ci]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --format=gcc, --external-sources, --enable=all, --shell=bash, --source-path=SCRIPTDIR]
  - repo: https://github.com/google/yamlfmt
    rev: v0.11.0
    hooks:
      - id: yamlfmt
        # Ledger snapshots are machine-written by workflow-ledger/scripts/ledger.sh
        # (Edit/Write hook-blocked); do not reformat script-owned output. FLAT
        # per-run files only — a nested runs/ yaml is hand-written by definition
        # and gets no exemption. state.yaml is the frozen legacy record.
        exclude: ^docs/executions/(state\.yaml|runs/[^/]+\.ya?ml)$
  - repo: local
    hooks:
      - id: skill-suite-lint
        name: validate skill suite hardening gates
        entry: dotfiles/.config/agents/skills/lint-skill-suite.sh dotfiles/.config/agents/skills
        language: script
        pass_filenames: false
      - id: skill-ref-lint
        name: validate skill cross-references
        entry: dotfiles/.config/agents/skills/lint-skill-refs.sh dotfiles/.config/agents/skills
        language: script
        pass_filenames: false
      - id: commit-normalize
        name: normalize commit message
        entry: dotfiles/.config/git/commit-normalize.sh
        language: script
        stages: [commit-msg]
        always_run: true
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Ledger snapshots are machine-written (hook-guarded) and every stamp
        # embeds fresh commit SHAs and lane sha256 digests, which
        # false-positive as high-entropy strings — a per-finding baseline can
        # never stay green (D-006). FLAT per-run files only, same rationale
        # as the yamlfmt exclude above.
        exclude: ^docs/executions/(state\.yaml|runs/[^/]+\.ya?ml)$
