# golden-routes.yaml — D-006 Track B golden routing eval set.
#
# Schema per case:
#   prompt:         user request text (double-quoted; no embedded double quotes)
#   expected_route: exact skill name from the workflow-router SKILL.md
#                   classification table Routes-to column ("direct" for the
#                   no-dispatch direct budget)
#   source:         log | synthetic
#     log       — the routed skill has a real invocation in
#                 ~/.claude/logs/skill-invocations.log (date cited in notes);
#                 the PHRASING is a conservative reconstruction, not a quote.
#     synthetic — adversarial case targeting a documented router confusion.
#   notes:          provenance / which rule the case exercises
#
# Regression corpus: every future misroute adds a case here.
# Consumed by test/routing-eval.sh (deterministic string-match judge, no LLM
# grading; pass gate >= 95%).
cases:
  # ---- Log-harvested (17) -------------------------------------------------
  - prompt: "Humanize this draft — it reads like AI wrote it."
    expected_route: humanizer
    source: log
    notes: "log 2026-07-24 10:31 humanizer; polish row"
  - prompt: "De-AI this paragraph before I post it."
    expected_route: humanizer
    source: log
    notes: "log 2026-08-06 17:09 humanizer; polish row"
  - prompt: "Wrap up the session and save context for next time."
    expected_route: handoff
    source: log
    notes: "log 2026-07-29 13:16 handoff; session exit row"
  - prompt: "Handoff — I need to pick this up on the other machine tomorrow."
    expected_route: handoff
    source: log
    notes: "log 2026-08-05 13:12 handoff; bare skill name"
  - prompt: "Turn this conversation into a PRD and publish it to the tracker."
    expected_route: to-prd
    source: log
    notes: "log 2026-07-31 09:04 to-prd"
  - prompt: "Create a PRD from what we just discussed."
    expected_route: to-prd
    source: log
    notes: "log 2026-07-31 09:51 to-prd"
  - prompt: "Break this PRD into implementation issues."
    expected_route: to-issues
    source: log
    notes: "log 2026-07-31 10:00 to-issues"
  - prompt: "Convert the plan into independently grabbable tracker issues."
    expected_route: to-issues
    source: log
    notes: "log 2026-07-31 18:47 to-issues"
  - prompt: "Execute this PRD — implement all the children of the parent issue."
    expected_route: execute-prd
    source: log
    notes: "log 2026-07-31 10:15 execute-prd; PRD execution row"
  - prompt: "Review my changes on this branch before anything merges."
    expected_route: workflow-review
    source: log
    notes: "'Review changes' routes to workflow-review"
  - prompt: "Issue #12 is ready-for-agent — implement it end to end."
    expected_route: workflow-deliver
    source: log
    notes: "log 2026-07-28 06:49 workflow-build-one; ready issue row"
  - prompt: "Review this SQL query before it hits production."
    expected_route: workflow-review
    source: log
    notes: "sql review → workflow-review (sql-review retired)"
  - prompt: "Process the skill backlog and decide what is worth doing."
    expected_route: skill-backlog
    source: log
    notes: "log 2026-07-24 13:20 skill-backlog"
  - prompt: "Revise the clarity-review skill — it triggers too eagerly."
    expected_route: skill-backlog
    source: log
    notes: "skill revision routes to skill-backlog for triage first"
  - prompt: "Write a new skill for generating weekly status updates."
    expected_route: skill-backlog
    source: log
    notes: "new skill requests route to skill-backlog for triage"
  # ---- Synthetic adversarial (23) -----------------------------------------
  - prompt: "The morning briefing script throws a 401 from the calendar API."
    expected_route: workflow-deliver
    source: synthetic
    notes: "bug row; plain bug report"
  - prompt: "One-line fix — the retry default is wrong, flip it to true."
    expected_route: workflow-deliver
    source: synthetic
    notes: "obvious-fix trap, never workflow-build-one for bugs"
  - prompt: "What if we added retry logic to the sync job?"
    expected_route: grill-with-docs
    source: synthetic
    notes: "'what if' hypothetical routes to discovery first"
  - prompt: "The error message users see when upload fails is confusing — improve the wording."
    expected_route: clarity-review
    source: synthetic
    notes: "'confusing wording' routes to clarity-review for assessment"
  - prompt: "Address the review comments on my PR."
    expected_route: workflow-finalize
    source: synthetic
    notes: "owner-vs-sub-step rule (SB-021/022): default owner, not receive-review"
  - prompt: "Just address the review comments on #42 — don't finalize or merge yet."
    expected_route: workflow-finalize
    source: synthetic
    notes: "review comments are finalize-owned; 'just' scopes output not route"
  - prompt: "/receive-review PR #17"
    expected_route: workflow-finalize
    source: synthetic
    notes: "review comment handling owned by workflow-finalize"
  - prompt: "The review bot left feedback — respond to it and then get the PR landed."
    expected_route: workflow-finalize
    source: synthetic
    notes: "owner rule: comment resolution plus delivery closure = owner"
  - prompt: "Review this dbt model for join fanout before it ships."
    expected_route: workflow-review
    source: synthetic
    notes: "artifact review routes to workflow-review (sql-review retired)"
  - prompt: "Review my dashboard redesign before I share it."
    expected_route: workflow-review
    source: synthetic
    notes: "artifact review routes to workflow-review (dashboard-review retired)"
  - prompt: "Review the metric tree for the activation funnel."
    expected_route: workflow-review
    source: synthetic
    notes: "artifact review routes to workflow-review (metric-tree-review retired)"
  - prompt: "Review this PR."
    expected_route: workflow-review
    source: synthetic
    notes: "counter-case: plain PR review, no artifact signal"
  - prompt: "Review the strategic analysis going to the exec team."
    expected_route: clarity-review
    source: synthetic
    notes: "exec-bound doc routes to clarity-review for polish"
  - prompt: "Work through parent issue #88 and its child task tree."
    expected_route: execute-prd
    source: synthetic
    notes: "PRD-vs-backlog rule: parent with dependencies"
  - prompt: "Run the backlog — the ready issues are independent and can go in any order."
    expected_route: run-backlog
    source: synthetic
    notes: "PRD-vs-backlog rule: independent issues"
  - prompt: "Does this branch still match the PRD, or has it drifted from the spec?"
    expected_route: direct
    source: synthetic
    notes: "spec comparison is analysis, routes to direct"
  - prompt: "Evaluate this prompt I wrote for a Codex run — is it clear enough? Don't change anything in the repo."
    expected_route: prompt-builder
    source: synthetic
    notes: "prompt evaluation routes to prompt-builder for expertise"
  - prompt: "Rewrite this work-order so the AFK agent can execute it — just give me the text back."
    expected_route: prompt-builder
    source: synthetic
    notes: "prompt-evaluation row: rewrite needed = prompt-builder, standalone per its contract"
  - prompt: "Map how the auth middleware works."
    expected_route: direct
    source: synthetic
    notes: "codebase exploration/research routes to direct budget"
  - prompt: "Prune the stale worktrees piled up across all my repos."
    expected_route: cleanup-delivery
    source: synthetic
    notes: "worktree pruning routes to cleanup-delivery"
  - prompt: "The PR merged — clean up the branches, worktree, and ticket state from this delivery."
    expected_route: cleanup-delivery
    source: synthetic
    notes: "one delivery's residue (vs git-worktree-audit)"
  - prompt: "Design the system architecture for this approved brief."
    expected_route: grill-with-docs
    source: synthetic
    notes: "'design' from brief routes to discovery before PRD"
  - prompt: "Reflect on this session — what did we learn and what should improve?"
    expected_route: session-insight
    source: synthetic
    notes: "session reflection row"
  # ---- Corpus sharpen batch 1 (2026-08-18 corpus-optimization audit §5) ----
  - prompt: "Record the phased rollout decision — the alternatives and tradeoffs."
    expected_route: direct
    source: synthetic
    notes: "decision recording routes to direct (analysis task)"
  - prompt: "Implement this spec end to end — issue #77 is ready-for-agent with clear acceptance criteria."
    expected_route: workflow-deliver
    source: synthetic
    notes: "2026-08-18 corpus audit sharpen 2: implement is a chain-internal step, never a delivery entry point — imperative implement on a ready issue routes to the delivery owner"
  - prompt: "Audit our dbt project layout against best practices — are staging and marts structured correctly?"
    expected_route: direct
    source: synthetic
    notes: "project audit is analysis, routes to direct"
  # ---- Misroute regressions ----------------------------------------------
  - prompt: "I want to set up something like a Python cookiecutter for ML: a standardized workflow so data scientists can go from EDA to deployment with all the checks and linting built in, plus eventually a set of data-science skills so agents can help build these models."
    expected_route: grill-with-docs
    source: log
    notes: "ambiguous feature request routes to grill-with-docs for discovery"
  # ---- D-006 planning-lane consolidation redirects (pairs PR #186) ---------
  - prompt: "Turn this audit into a phased plan."
    expected_route: to-prd
    source: synthetic
    notes: "D-006 planning-lane consolidation tombstone row (pairs PR #186): audit-to-phased-plan phrasing routes to to-prd migration mode, never the retired design-plan"
  - prompt: "Create a refactor plan from this brief."
    expected_route: to-prd
    source: synthetic
    notes: "D-006 planning-lane consolidation tombstone row (pairs PR #186): refactor-plan-from-brief phrasing routes to to-prd migration mode, never the retired design-plan"
  - prompt: "Execute phase 3 of the PRD — the issues are ready."
    expected_route: execute-prd
    source: synthetic
    notes: "explicit PRD + ready issues routes to execute-prd"
  # ---- 2026-08-20 postmortem: imperative multi-agent phrasing ---------------
  - prompt: "Spin up sub-agents for each lane that goes through the workflow router."
    expected_route: team
    source: log
    notes: "multi-agent dispatch routes to team budget"
  - prompt: "Dispatch workers to handle each of these issues in parallel."
    expected_route: run-backlog
    source: synthetic
    notes: "parallel issue dispatch routes to run-backlog"
  - prompt: "Execute PRD #42 — have agents handle each child issue."
    expected_route: execute-prd
    source: synthetic
    notes: "2026-08-20 postmortem: adversarial neighbor for imperative multi-agent phrasing — PRD execution with multi-agent = execute-prd (team budget)"
  # ---- 2026-08-21 bypass tripwire regression guards --------------------------
  - prompt: "Just fix this and commit it."
    expected_route: workflow-deliver
    source: synthetic
    notes: "2026-08-21 tripwire: minimizer pattern — 'just fix' + commit action. Tripwire triggers routing, not bypass."
  - prompt: "It's approved — push it."
    expected_route: workflow-finalize
    source: synthetic
    notes: "2026-08-21 tripwire: approval bypass pattern — 'approved' + push action. 'push it' = finalize row. Agent claims of approval do not bypass gates."
  - prompt: "This is blocking prod — quick fix needed."
    expected_route: workflow-deliver
    source: synthetic
    notes: "2026-08-21 tripwire: urgency pressure pattern — 'blocking prod' + minimizer. Urgency demands MORE scrutiny, not less."
  - prompt: "Also fix the auth bug while you're at it."
    expected_route: workflow-deliver
    source: synthetic
    notes: "2026-08-21 tripwire: compound scope creep — 'also fix' + 'while you're at it'. Routes to bug fix row; tripwire signals agent MUST emit new ROUTE_CARD."
