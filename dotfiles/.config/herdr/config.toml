onboarding = false
[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    "workspace",
    "tab",
  ],
  [
    "agent",
  ],
  [
    { token = "$task", fg = "#72cffd", dim = true },
  ],
]

[experimental]
pane_history = false

# Custom command keybindings — native replacements for third-party plugins.
# Run in a temp pane in the focused pane's cwd; closes on exit.
switch_ascii_input_source_in_prefix = true
[[keys.command]]
key = "prefix+alt+h"                      # steals hunk.diff plugin: interactive diff review
type = "pane"
command = "hunk diff"
description = "hunk: review working tree"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+alt+z"                            # steals den-tanui/herdr-zoxide: fzf a dir -> new workspace
type = "pane"
command = "~/.config/herdr/zoxide-workspace.sh"
description = "zoxide: open dir as workspace"

# Bind plugin actions that ship no default keybind.
# prefix+a = attention (needs-you: blocked->done); prefix+alt+a = cycle in-flight agents.
[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "active-agent.jump.next"
description = "cycle in-flight agents"

[[keys.command]]
key = "prefix+alt+p"
type = "plugin_action"
command = "herdr-picker-plus.open"
description = "picker-plus: fuzzy jump anywhere"

[[keys.command]]
key = "prefix+alt+w"
type = "pane"
command = "~/.config/herdr/worktree-picker.sh"
description = "worktree: open existing"

[[keys.command]]
key = "prefix+alt+W"
type = "pane"
command = "~/.config/herdr/worktree-remove.sh"
description = "worktree: remove checkout"

[[keys.command]]
key = "prefix+alt+i"
type = "pane"
command = "~/.config/herdr/agent-picker.sh"
description = "agent: select integration"

[[keys.command]]
key = "prefix+alt+n"
type = "pane"
command = "~/.config/herdr/project-workspace.sh"
description = "workspace: new from project"

[ui.sound]
enabled = false

[theme]
name = "tokyo-night" # solid backgrounds, then override colors
auto_switch = false

[theme.custom]
# Zed Ayu Mirage - adjusted for visible focus
panel_bg = "#1f2129"    # darker base
surface0 = "#363943"    # focus rows - now visible against darker base
surface1 = "#454850"    # hover/secondary
surface_dim = "#1f2129" # matches panel_bg
overlay0 = "#7b7d7f"
overlay1 = "#9a9a98"
text = "#cccac2"
subtext0 = "#9a9a98"
accent = "#fecf72"
green = "#d5fe80"
yellow = "#fecf72"
red = "#f18779"
blue = "#72cffd"
teal = "#95e6cb"
peach = "#ffae57"
mauve = "#dfbfff"
